  <meta charset="UTF-8">

  <title>MA Learn — مشغّل الدورة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ─── TOKENS ─────────────────────────────────── */
    :root {
      --bg:        #080808;
      --surface:   #111111;
      --surface2:  #181818;
      --surface3:  #1e1e1e;
      --border:    rgba(201,168,76,0.12);
      --gold:      #C9A84C;
      --gold-lt:   #E8D08A;
      --ivory:     #F5F0E8;
      --silver:    #BBBBBB;
      --grey:      #666666;
      --green:     #4CAF82;
      --nav-h:     56px;
      --sidebar-w: 300px;
      --bar-h:     3px;
    }

    /* ─── RESET ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--ivory);
      direction: rtl;
      overflow: hidden;
    }

    /* ─── TOP NAV ────────────────────────────────── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(8,8,8,0.97);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      display: flex; align-items: center;
      padding: 0 18px; gap: 14px;
      z-index: 200;
    }
    .nav-logo { height: 24px; width: auto; flex-shrink: 0; }
    .nav-divider { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    .nav-course {
      font-size: 0.8rem; color: var(--silver); font-weight: 400;
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nav-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .nav-progress-text { font-size: 0.72rem; color: var(--grey); }
    .nav-hamburger {
      display: none; background: none; border: none;
      color: var(--silver); cursor: pointer; padding: 6px;
      font-size: 1.3rem; line-height: 1;
    }

    /* Gold progress bar — below nav */
    .progress-bar-track {
      position: fixed; top: var(--nav-h); left: 0; right: 0;
      height: var(--bar-h); background: rgba(201,168,76,0.1); z-index: 199;
    }
    .progress-bar-fill {
      height: 100%; background: var(--gold);
      transition: width 0.4s ease; width: 0%;
    }

    /* ─── LAYOUT ─────────────────────────────────── */
    .layout {
      display: flex;
      height: 100vh; height: 100svh;
      padding-top: calc(var(--nav-h) + var(--bar-h));
    }

    /* ─── SIDEBAR ────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }
    .sidebar-header {
      padding: 14px 18px;
      font-size: 0.68rem; color: var(--gold);
      letter-spacing: 0.1em; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }
    .sidebar-watched { font-size: 0.7rem; color: var(--grey); letter-spacing: 0; text-transform: none; }

    .sidebar-scroll { overflow-y: auto; flex: 1; }
    .sidebar-scroll::-webkit-scrollbar { width: 3px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.2); }

    /* Module group */
    .module-group { border-bottom: 1px solid var(--border); }
    .module-title {
      padding: 11px 18px;
      font-size: 0.8rem; font-weight: 600; color: var(--ivory);
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
      transition: background 0.15s;
    }
    .module-title:hover { background: rgba(255,255,255,0.02); }
    .module-meta { margin-right: auto; display: flex; align-items: center; gap: 8px; }
    .module-count { font-size: 0.65rem; color: var(--grey); font-weight: 400; }
    .module-check {
      width: 16px; height: 16px; border-radius: 50%;
      border: 1.5px solid rgba(201,168,76,0.25);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 0.55rem; color: transparent;
      transition: all 0.3s;
    }
    .module-check.done { background: var(--green); border-color: var(--green); color: #fff; }
    .module-chevron {
      font-size: 0.6rem; color: var(--grey);
      transition: transform 0.25s; flex-shrink: 0;
    }
    .module-title.open .module-chevron { transform: rotate(180deg); }

    .lesson-list { display: none; }
    .lesson-list.open { display: block; }

    /* Lesson item */
    .lesson-item {
      padding: 9px 18px 9px 22px;
      font-size: 0.77rem; color: var(--silver); font-weight: 400;
      cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: background 0.12s, color 0.12s;
      border-right: 3px solid transparent;
      line-height: 1.4;
    }
    .lesson-item:hover { background: rgba(201,168,76,0.05); color: var(--ivory); }
    .lesson-item.active { background: rgba(201,168,76,0.09); color: var(--gold); border-right-color: var(--gold); }
    .lesson-item.watched:not(.active) .lesson-dot { background: rgba(76,175,130,0.7); }
    .lesson-item.coming-soon { opacity: 0.4; cursor: default; pointer-events: none; }

    .lesson-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.12); flex-shrink: 0;
      transition: background 0.3s;
    }
    .lesson-item.active .lesson-dot { background: var(--gold); }
    .lesson-num { font-size: 0.62rem; color: var(--grey); flex-shrink: 0; min-width: 18px; }
    .lesson-title-text { flex: 1; }
    .lesson-soon-tag {
      font-size: 0.6rem; color: var(--grey);
      background: rgba(255,255,255,0.05);
      padding: 2px 6px; border-radius: 3px; flex-shrink: 0;
    }

    /* ─── MOBILE OVERLAY ─────────────────────────── */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 150;
      backdrop-filter: blur(2px);
    }
    .sidebar-overlay.active { display: block; }

    /* ─── MAIN CONTENT ───────────────────────────── */
    .main-content {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
      min-width: 0;
    }
    .main-content::-webkit-scrollbar { width: 4px; }
    .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); }

    /* Video */
    .video-area { background: #000; flex-shrink: 0; }
    .video-wrapper { width: 100%; aspect-ratio: 16/9; position: relative; }
    .video-wrapper iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: none;
    }
    .video-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--surface2); color: var(--grey);
      font-size: 0.88rem; font-weight: 300; gap: 10px;
    }
    .video-placeholder-icon { font-size: 2.8rem; opacity: 0.35; }

    /* Lesson body */
    .lesson-body { padding: 24px 32px 40px; max-width: 860px; }

    .lesson-meta-row {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px;
    }
    .lesson-module-tag {
      font-size: 0.65rem; color: var(--gold);
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .lesson-num-badge {
      font-size: 0.65rem; color: var(--grey);
      background: rgba(255,255,255,0.05);
      padding: 2px 8px; border-radius: 3px;
    }

    .lesson-title {
      font-size: 1.35rem; font-weight: 700;
      margin-bottom: 16px; line-height: 1.4;
    }

    /* Action bar */
    .action-bar {
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap; margin-bottom: 20px;
    }
    .mark-complete-btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--gold); color: #000;
      border: none; padding: 9px 20px;
      font-family: 'Cairo', sans-serif; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; border-radius: 5px; transition: all 0.2s;
    }
    .mark-complete-btn:hover { background: var(--gold-lt); }
    .mark-complete-btn.done {
      background: rgba(76,175,130,0.15);
      color: var(--green); border: 1px solid rgba(76,175,130,0.35);
      cursor: default;
    }
    .mark-complete-btn.done:hover { background: rgba(76,175,130,0.15); }

    .pdf-btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(201,168,76,0.08); border: 1px solid rgba(201,168,76,0.25);
      color: var(--gold); padding: 9px 18px; border-radius: 5px;
      text-decoration: none; font-size: 0.8rem; font-weight: 600;
      transition: all 0.2s;
    }
    .pdf-btn:hover { background: rgba(201,168,76,0.16); border-color: rgba(201,168,76,0.45); }

    /* Description */
    .lesson-desc {
      font-size: 0.875rem; color: var(--silver);
      font-weight: 300; line-height: 1.9;
      margin-bottom: 24px;
    }

    /* Rich content from Apps Script */
    .lesson-content {
      font-size: 0.875rem; color: var(--silver);
      font-weight: 300; line-height: 1.9;
      border-top: 1px solid var(--border);
      padding-top: 24px; margin-bottom: 32px;
    }
    .lesson-content:empty { display: none; }
    .lesson-content h3 { color: var(--ivory); font-size: 1rem; margin-bottom: 10px; }
    .lesson-content ul, .lesson-content ol { padding-right: 20px; margin-bottom: 12px; }
    .lesson-content li { margin-bottom: 5px; }
    .lesson-content strong { color: var(--ivory); font-weight: 600; }
    .lesson-content code {
      background: var(--surface3); color: var(--gold-lt);
      padding: 2px 6px; border-radius: 3px; font-size: 0.82rem;
      font-family: monospace;
    }

    /* Lesson navigation */
    .lesson-nav {
      display: flex; gap: 10px; align-items: center;
      padding-top: 20px; border-top: 1px solid var(--border);
    }
    .nav-btn {
      padding: 10px 22px; font-size: 0.82rem;
      font-family: 'Cairo', sans-serif; font-weight: 600;
      border: 1px solid var(--border); background: transparent;
      color: var(--silver); cursor: pointer; border-radius: 5px;
      transition: all 0.2s;
    }
    .nav-btn:hover:not(:disabled) { border-color: rgba(201,168,76,0.4); color: var(--ivory); }
    .nav-btn.primary { background: var(--gold); color: #000; border-color: var(--gold); }
    .nav-btn.primary:hover:not(:disabled) { background: var(--gold-lt); }
    .nav-btn:disabled { opacity: 0.28; cursor: not-allowed; }

    .nav-btn-auto {
      margin-right: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: var(--grey); cursor: pointer;
      background: none; border: none; font-family: 'Cairo', sans-serif;
    }
    .nav-btn-auto .toggle {
      width: 28px; height: 16px; border-radius: 8px;
      background: rgba(255,255,255,0.1); position: relative;
      transition: background 0.2s;
    }
    .nav-btn-auto.on .toggle { background: rgba(201,168,76,0.5); }
    .nav-btn-auto .toggle::after {
      content: ''; position: absolute; top: 2px; right: 2px;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--grey); transition: transform 0.2s, background 0.2s;
    }
    .nav-btn-auto.on .toggle::after { transform: translateX(-12px); background: var(--gold); }

    /* ─── LOADING / DENIED OVERLAYS ──────────────── */
    .overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 1000; text-align: center; padding: 32px;
    }
    .overlay.hidden { display: none; }
    .spinner {
      width: 38px; height: 38px; border-radius: 50%;
      border: 2px solid rgba(201,168,76,0.15);
      border-top-color: var(--gold);
      animation: spin 0.75s linear infinite; margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface); border: 1px solid var(--border);
      border-right: 3px solid var(--green);
      color: var(--ivory); font-size: 0.82rem; font-weight: 400;
      padding: 11px 22px; border-radius: 6px; z-index: 500;
      transition: transform 0.35s ease, opacity 0.35s ease; opacity: 0;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ─── RESPONSIVE ─────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed; top: calc(var(--nav-h) + var(--bar-h)); bottom: 0; right: 0;
        z-index: 160; transform: translateX(100%);
      }
      .sidebar.mobile-open { transform: translateX(0); }
      .nav-hamburger { display: block; }
      .lesson-body { padding: 18px 18px 32px; }
      .lesson-title { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <!-- Overlays -->
  <div id="loading-overlay" class="overlay">
    <div class="spinner"></div>

  <nav class="top-nav" id="top-nav" style="display:none;">
    <img class="nav-logo" src="brand_assets/logo-malearn-white.png" alt="MA Learn"

      <span class="nav-progress-text" id="nav-progress-text"></span>

  <!-- Layout -->
  <div class="layout" id="course-layout" style="display:none;">

      <div class="video-area">

            style="display:none;"></iframe>
        </div>

      <!-- Lesson info -->
      <div class="lesson-body">
        <div class="lesson-meta-row">
          <span class="lesson-module-tag" id="lesson-module-tag"></span>
          <span class="lesson-num-badge" id="lesson-num-badge"></span>
        </div>
        <h1 class="lesson-title" id="lesson-title">اختر درساً من القائمة</h1>

        <!-- Action bar -->

          <button class="mark-complete-btn" id="mark-complete-btn" onclick="markComplete()">

            <span id="mark-label">تم الانتهاء من الدرس</span>
          </button>

        <div class="lesson-content" id="lesson-content"></div>

        <!-- Nav -->
        <div class="lesson-nav" id="lesson-nav" style="display:none;">
          <button class="nav-btn" id="btn-prev" onclick="navigateLesson(-1)" disabled>→ السابق</button>
          <button class="nav-btn primary" id="btn-next" onclick="navigateLesson(1)" disabled>التالي ←</button>
          <button class="nav-btn-auto" id="auto-advance-btn" onclick="toggleAutoAdvance()">
            <span>انتقال تلقائي</span>
            <span class="toggle"></span>
          </button>
        </div>
      </div>

    </main>
  </div>

    // ════════════════════════════════════════════════
    // STATE
    // ════════════════════════════════════════════════
    let courseId           = 'intro-to-creative-ai';
    let token              = '';
    let curriculum         = [];
    let allLessons         = [];
    let currentIndex       = 0;
    let watchedIds         = new Set();
    let autoAdvance        = false;
    let courseConfig       = {};

    // ════════════════════════════════════════════════
    // PROGRESS — localStorage
    // ════════════════════════════════════════════════
    function progressKey() { return `mal_progress_${courseId}`; }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(progressKey());
        if (!raw) return;
        const data = JSON.parse(raw);
        watchedIds = new Set(data.watched || []);
        autoAdvance = data.autoAdvance || false;
      } catch(e) {}
    }

    function saveProgress(lastLessonId) {
      try {
        localStorage.setItem(progressKey(), JSON.stringify({
          watched:     Array.from(watchedIds),
          lastLesson:  lastLessonId,
          autoAdvance: autoAdvance
        }));
      } catch(e) {}
    }

    function getLastLessonId() {
      try {
        const raw = localStorage.getItem(progressKey());
        if (!raw) return null;
        return JSON.parse(raw).lastLesson || null;
      } catch(e) { return null; }
    }

    // ════════════════════════════════════════════════
    // PROGRESS BAR + SIDEBAR COUNTER
    // ════════════════════════════════════════════════
    function updateProgressUI() {
      const total = allLessons.filter(l => l.video_id).length;
      const done  = allLessons.filter(l => l.video_id && watchedIds.has(l.id)).length;
      const pct   = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById('progress-fill').style.width     = pct + '%';
      document.getElementById('nav-progress-text').textContent = `${done} / ${allLessons.length} درس`;
      document.getElementById('sidebar-watched').textContent   = `${done} / ${total} ✓`;
    }

    // ════════════════════════════════════════════════
    // VIDEO PLAYER
    // ════════════════════════════════════════════════
    function buildVideoUrl(videoId) {
      if (!videoId) return null;
      const cfg = courseConfig;
      // Bunny: UUID format (contains hyphens, 36 chars)
      const isBunny = cfg.playerType === 'bunny' && cfg.bunnyLibraryId;
      if (isBunny) {
        return `https://iframe.mediadelivery.net/embed/${cfg.bunnyLibraryId}/${videoId}?autoplay=true&loop=false&muted=false&preload=true&responsive=true`;
      }
      // YouTube fallback
      return `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
    }

    // ════════════════════════════════════════════════
    // LOAD LESSON
    // ════════════════════════════════════════════════
    function loadLesson(index) {
      if (index < 0 || index >= allLessons.length) return;

      const lesson = allLessons[index];
      currentIndex = index;

      // Sidebar: update active state
      document.querySelectorAll('.lesson-item').forEach(el => el.classList.remove('active'));
      const item = document.getElementById(`li-${lesson.id}`);
      if (item) {
        item.classList.add('active');
        item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // Video
      const placeholder = document.getElementById('video-placeholder');
      const iframe      = document.getElementById('video-iframe');
      const videoUrl    = buildVideoUrl(lesson.video_id);

      if (videoUrl) {
        placeholder.style.display  = 'none';
        iframe.style.display       = 'block';
        iframe.src                 = videoUrl;
      } else {
        iframe.style.display       = 'none';
        iframe.src                 = '';
        placeholder.style.display  = 'flex';
        placeholder.innerHTML      = '<span class="video-placeholder-icon">🎬</span><span>الفيديو قادم قريباً</span>';
      }

      // Meta
      document.getElementById('lesson-module-tag').textContent = lesson.moduleName || '';
      document.getElementById('lesson-num-badge').textContent  = `درس ${index + 1} من ${allLessons.length}`;
      document.getElementById('lesson-title').textContent      = lesson.title;
      document.getElementById('lesson-desc').textContent       = lesson.desc || '';
      document.getElementById('lesson-content').innerHTML      = '';

      // Action bar
      const actionBar = document.getElementById('action-bar');
      actionBar.style.display = lesson.video_id ? 'flex' : 'none';

      // Mark complete state
      updateMarkBtn(lesson.id);

      // PDF
      const pdfBtn = document.getElementById('pdf-btn');
      if (lesson.pdf_url) {
        pdfBtn.href = lesson.pdf_url;
        pdfBtn.style.display = 'inline-flex';
      } else {
        pdfBtn.style.display = 'none';
      }

      // Nav buttons
      document.getElementById('lesson-nav').style.display = 'flex';
      const prevLesson = allLessons.slice(0, index).reverse().find(l => l.video_id);
      const nextLesson = allLessons.slice(index + 1).find(l => l.video_id);
      const prevIdx    = prevLesson ? allLessons.indexOf(prevLesson) : -1;
      const nextIdx    = nextLesson ? allLessons.indexOf(nextLesson) : -1;

      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      btnPrev.disabled = prevIdx === -1;
      btnNext.disabled = nextIdx === -1;
      btnPrev._target  = prevIdx;
      btnNext._target  = nextIdx;
      btnNext.textContent = nextIdx === -1 ? 'آخر درس ✓' : 'التالي ←';

      // Auto-advance toggle UI
      const autoBtn = document.getElementById('auto-advance-btn');
      autoBtn.classList.toggle('on', autoAdvance);

      // Save position
      saveProgress(lesson.id);

      // Load rich content (non-blocking)
      fetchLessonContent(lesson.id);

      // Scroll main to top
      document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });

      // Close mobile sidebar
      if (window.innerWidth <= 768) closeSidebar();
    }

    function updateMarkBtn(lessonId) {
      const btn   = document.getElementById('mark-complete-btn');
      const icon  = document.getElementById('mark-icon');
      const label = document.getElementById('mark-label');
      const done  = watchedIds.has(lessonId);
      btn.classList.toggle('done', done);
      icon.textContent  = done ? '✓' : '○';
      label.textContent = done ? 'تم الإنهاء' : 'تم الانتهاء من الدرس';
    }

    // ════════════════════════════════════════════════
    // MARK COMPLETE
    // ════════════════════════════════════════════════
    function markComplete() {
      const lesson = allLessons[currentIndex];
      if (!lesson || !lesson.video_id) return;
      if (watchedIds.has(lesson.id)) return; // already done

      watchedIds.add(lesson.id);
      saveProgress(lesson.id);
      updateMarkBtn(lesson.id);
      updateProgressUI();
      updateModuleStates();

      // Update sidebar dot
      const item = document.getElementById(`li-${lesson.id}`);
      if (item) item.classList.add('watched');

      showToast('تم تسجيل إنهاء الدرس ✓');

      // Auto-advance
      if (autoAdvance) {
        const nextIdx = document.getElementById('btn-next')._target;
        if (nextIdx >= 0) {
          setTimeout(() => loadLesson(nextIdx), 1400);
        }
      }
    }

    // ════════════════════════════════════════════════
    // MODULE COMPLETION STATE
    // ════════════════════════════════════════════════
    function updateModuleStates() {
      curriculum.forEach((mod, mi) => {
        const activeLessons = mod.lessons.filter(l => l.video_id);
        if (activeLessons.length === 0) return;
        const allDone = activeLessons.every(l => watchedIds.has(l.id));
        const check   = document.getElementById(`mod-check-${mi}`);
        if (check) check.classList.toggle('done', allDone);
      });
    }

    // ════════════════════════════════════════════════
    // LESSON NAVIGATION
    // ════════════════════════════════════════════════
    function navigateLesson(dir) {
      const btn    = dir < 0 ? document.getElementById('btn-prev') : document.getElementById('btn-next');
      const target = btn._target;
      if (typeof target !== 'undefined' && target >= 0) loadLesson(target);
    }

    // ════════════════════════════════════════════════
    // AUTO-ADVANCE TOGGLE
    // ════════════════════════════════════════════════
    function toggleAutoAdvance() {
      autoAdvance = !autoAdvance;
      document.getElementById('auto-advance-btn').classList.toggle('on', autoAdvance);
      saveProgress(allLessons[currentIndex]?.id);
      showToast(autoAdvance ? 'الانتقال التلقائي مفعّل' : 'الانتقال التلقائي متوقف');
    }

    // ════════════════════════════════════════════════
    // RICH CONTENT FETCH
    // ════════════════════════════════════════════════
    async function fetchLessonContent(lessonId) {
      try {
        const res  = await fetch(`${APPS_SCRIPT_URL}?action=get_content&lesson_id=${encodeURIComponent(lessonId)}&token=${encodeURIComponent(token)}&course=${encodeURIComponent(courseId)}`);
        const data = await res.json();
        if (data.content) {
          document.getElementById('lesson-content').innerHTML = data.content;
        }
      } catch(e) { /* silent — content is optional */ }
    }

    // ════════════════════════════════════════════════
    // SIDEBAR BUILD
    // ════════════════════════════════════════════════
    function buildSidebar() {
      const container = document.getElementById('curriculum-list');
      container.innerHTML = '';

      let globalN = 0;
      curriculum.forEach((mod, mi) => {
        globalN++; // module counter (visual only)
        const group   = document.createElement('div');
        group.className = 'module-group';

        const header  = document.createElement('div');
        header.id       = `mod-header-${mi}`;
        header.className = 'module-title' + (mi === 0 ? ' open' : '');
        header.innerHTML = `
          <div class="module-check" id="mod-check-${mi}"></div>
          <span style="flex:1;">${mod.module}</span>
          <div class="module-meta">
            <span class="module-count">${mod.lessons.length}</span>
            <span class="module-chevron">▾</span>
          </div>`;
        header.onclick = () => {
          header.classList.toggle('open');
          list.classList.toggle('open');
        };

        const list    = document.createElement('div');
        list.className = 'lesson-list' + (mi === 0 ? ' open' : '');

        let lessonN = 0;
        mod.lessons.forEach(lesson => {
          lessonN++;
          const globalIndex = allLessons.findIndex(l => l.id === lesson.id);
          const hasVideo    = !!lesson.video_id;
          const isWatched   = watchedIds.has(lesson.id);

          const item = document.createElement('div');
          item.className = [
            'lesson-item',
            hasVideo ? '' : 'coming-soon',
            isWatched ? 'watched' : ''
          ].filter(Boolean).join(' ');
          item.id = `li-${lesson.id}`;

          item.innerHTML = `
            <span class="lesson-dot"></span>
            <span class="lesson-title-text">${lesson.title}</span>
            ${!hasVideo ? '<span class="lesson-soon-tag">قريباً</span>' : ''}`;

          if (hasVideo) item.onclick = () => loadLesson(globalIndex);
          list.appendChild(item);
        });

        group.appendChild(header);
        group.appendChild(list);
        container.appendChild(group);
      });

      updateModuleStates();
    }

    // ════════════════════════════════════════════════
    // MOBILE SIDEBAR
    // ════════════════════════════════════════════════
    function toggleSidebar() {
      const sidebar  = document.getElementById('sidebar');
      const overlay  = document.getElementById('sidebar-overlay');
      const isOpen   = sidebar.classList.contains('mobile-open');
      sidebar.classList.toggle('mobile-open', !isOpen);
      overlay.classList.toggle('active', !isOpen);
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('mobile-open');
      document.getElementById('sidebar-overlay').classList.remove('active');
    }

    // ════════════════════════════════════════════════
    // KEYBOARD NAVIGATION
    // ════════════════════════════════════════════════
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft')  navigateLesson(1);
      if (e.key === 'ArrowRight') navigateLesson(-1);
      if (e.key === 'c' || e.key === 'C') markComplete();
    });

    // ════════════════════════════════════════════════
    // TOAST
    // ════════════════════════════════════════════════
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ════════════════════════════════════════════════
    // CURRICULUM UTILS
    // ════════════════════════════════════════════════
    function flattenCurriculum(curr) {
      return curr.flatMap(mod => mod.lessons.map(l => ({ ...l, moduleName: mod.module })));
    }

    async function loadCurriculumFromApi() {
      try {
        const res  = await fetch(`${APPS_SCRIPT_URL}?action=get_course_lessons&course=${courseId}&token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!data.lessons || data.lessons.length === 0) return null;

        const modules = {}, order = [];
        data.lessons.forEach(l => {
          const key = l.module_order + '::' + l.module;
          if (!modules[key]) { modules[key] = { module: l.module, module_order: l.module_order, lessons: [] }; order.push(key); }
          if (l.active !== false) modules[key].lessons.push(l);
        });
        const result = order.map(k => modules[k]).filter(m => m.lessons.length > 0);
        return result.length > 0 ? result : null;
      } catch(e) { return null; }
    }

    // ════════════════════════════════════════════════
    // TOKEN VALIDATION
    // ════════════════════════════════════════════════
    async function validateToken(tok, cid) {
      try {
        const res  = await fetch(`${APPS_SCRIPT_URL}?action=validate_token&token=${encodeURIComponent(tok)}&course=${encodeURIComponent(cid)}`);
        const data = await res.json();
        return data.valid === true;
      } catch(e) {
        return true; // fail-open — never block a paying student
      }
    }

    // ════════════════════════════════════════════════
    // INIT
    // ════════════════════════════════════════════════
    async function init() {
      const params = new URLSearchParams(window.location.search);
      token    = params.get('token') || '';
      courseId = params.get('course') || 'intro-to-creative-ai';

      if (!token) {
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('access-denied').classList.remove('hidden');
        return;
      }

      const valid = await validateToken(token, courseId);
      if (!valid) {
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('access-denied').classList.remove('hidden');
        return;
      }

      // Config
      courseConfig = COURSE_CONFIG[courseId] || COURSE_CONFIG['intro-to-creative-ai'];
      document.getElementById('nav-course-name').textContent = courseConfig.name;
      document.title = `${courseConfig.name} | MA Learn`;

      // Load progress
      loadProgress();

      // Curriculum (API → fallback)
      const dynamic = await loadCurriculumFromApi();
      curriculum    = dynamic || FALLBACK_CURRICULUM[courseId] || FALLBACK_CURRICULUM['intro-to-creative-ai'];
      allLessons    = flattenCurriculum(curriculum);

      // Show UI
      document.getElementById('loading-overlay').classList.add('hidden');
      document.getElementById('top-nav').style.display    = 'flex';
      document.getElementById('course-layout').style.display = 'flex';

      buildSidebar();
      updateProgressUI();

      // Resume or start from first video lesson
      const lastId  = getLastLessonId();
      const resumeIndex = lastId ? allLessons.findIndex(l => l.id === lastId) : -1;
      const startIndex  = resumeIndex >= 0 ? resumeIndex
                        : allLessons.findIndex(l => l.video_id);
      loadLesson(startIndex >= 0 ? startIndex : 0);
    }

    init();
  </script>
</body>
</html>
