<!--
  Auto-discount for buyers who already own دورة المدخل (ITCAI).
  Killed 2026-05-04 — the increment-on-blur design has a leak (multiple
  reloads accumulate uses_left). Reviving requires architectural fix:
  modify validateCoupon() in Apps Script to special-case ITCAIPRE so it
  only redeems if buyer email has T2 token in Token Pool, regardless
  of uses_left. See feedback_pricing_test_language.md + Token Pool sheet.

  To revive: paste this <script> block into checkout.html before </body>,
  then modify validateCoupon() to gate by email-has-T2-token instead of
  uses_left counter.
-->
<script>
  (function () {
    const APPS_SCRIPT_BASE = 'https://script.google.com/macros/s/AKfycbznjcsYu8gLDZqFJGededAQaATad_L8vlhRQV04pOqh57HB5nFVRy9zUHAcg6goyj8DKA/exec';
    const emailEl  = document.getElementById('email');
    const couponIn = document.getElementById('coupon-input');
    const couponBt = document.getElementById('coupon-btn');
    if (!emailEl || !couponIn || !couponBt) return;

    let lastChecked = '';
    emailEl.addEventListener('blur', async () => {
      try {
        const email = (emailEl.value || '').trim().toLowerCase();
        if (!email || email === lastChecked || !email.includes('@')) return;
        lastChecked = email;
        if (couponIn.value && couponIn.value.trim()) return;

        const res = await fetch(APPS_SCRIPT_BASE + '?action=check_existing_token&email=' + encodeURIComponent(email));
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.has_existing_madkhal && !couponIn.value) {
          couponIn.value = 'ITCAIPRE';
          couponBt.click();
        }
      } catch (e) {
        // Silent fail
      }
    });
  })();
</script>
