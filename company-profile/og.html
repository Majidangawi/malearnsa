<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>OG — MA Learn Company Profile</title>
  <!-- Source for img/og-company-profile.jpg — screenshot at 1200×630. -->
  <link rel="stylesheet" href="https://malearnsa.com/brand/ma-v4.css">
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 1fr 360px; gap: 56px; align-items: center; padding: 0 72px; }
    .og::before { content: ""; position: absolute; inset: 0; background: var(--glow-hero); pointer-events: none; }
    .txt { position: relative; z-index: 1; }
    .logo { height: 40px; width: auto; margin-bottom: 34px; }
    .eyebrow { margin-bottom: 26px; font-size: 1rem; }
    h1 { font-size: 3.1rem; line-height: 1.35; }
    .sub { margin-top: 22px; color: var(--muted); font-size: 1.32rem; font-weight: 700; direction: ltr; text-align: right; }
    .pic { position: relative; z-index: 1; height: 470px; border-radius: var(--r-2xl); overflow: hidden; border: 1.5px solid var(--line-strong); box-shadow: var(--shadow-raised); }
    .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  </style>
</head>
<body>
  <div class="og">
    <div class="txt">
      <img class="logo" src="/brand_assets/logo-malearn-white.png" alt="MA Learn">
      <div><span class="eyebrow"><span class="num">2026</span>الملف التعريفي · Company Profile</span></div>
      <h1 class="disp">نبني قدرات الذكاء الاصطناعي الإبداعي <span class="hl">لفرق العمل</span></h1>
      <p class="sub">Creative AI training, systems &amp; advisory for teams</p>
    </div>
    <div class="pic"><img src="img/majid-angawi.webp" alt=""></div>
  </div>
</body>
</html>
