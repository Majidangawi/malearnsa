name: Monthly LLM discovery refresh reminder

# Fires on the 1st of every month at 06:07 UTC (09:07 KSA)
# and opens a tracking issue so the monthly refresh is never missed.
#
# The SOP at references/sops/monthly-llms-refresh.md is executed by Claude
# in Majid's next session. This workflow is the durable *reminder* — the
# actual file updates stay human-reviewed to preserve brand voice.

on:
  schedule:
    - cron: "7 6 1 * *"
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  open-refresh-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open monthly refresh issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const month = now.toLocaleString('en-US', { month: 'long', timeZone: 'Asia/Riyadh' });
            const year  = now.getFullYear();
            const title = `LLM discovery refresh — ${month} ${year}`;
            const body = [
              `**Priority:** HIGH`,
              ``,
              `It's time for the monthly MA Learn LLM discovery refresh.`,
              ``,
              `Ask Claude:`,
              ``,
              `> Execute the monthly LLM discovery refresh SOP at references/sops/monthly-llms-refresh.md. Inventory current MA Learn offerings, diff against llms.txt / llms-full.txt / index.html JSON-LD, apply updates, commit + push, and post a brief status with added/removed/price-updates and commit SHA.`,
              ``,
              `---`,
              ``,
              `**Files to review:** llms.txt · llms-full.txt · index.html (JSON-LD)`,
              `**SOP:** [references/sops/monthly-llms-refresh.md](../blob/main/references/sops/monthly-llms-refresh.md)`,
              ``,
              `Close this issue once the refresh is committed. The next reminder fires automatically on the 1st of next month.`,
            ].join('\n');

            // Avoid duplicating the issue if re-run the same day.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'monthly-refresh',
              per_page: 10,
            });
            if (existing.data.some(i => i.title === title)) {
              console.log(`Issue already open: ${title}`);
              return;
            }

            const res = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['monthly-refresh', 'priority-high', 'llm-seo'],
            });
            console.log(`Opened #${res.data.number}: ${res.data.html_url}`);
