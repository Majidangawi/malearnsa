<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>OG — ماجد عنقاوي × Figma Weave</title>
<link rel="stylesheet" href="https://malearnsa.com/brand/ma-v4.css">
<style>
  html,body{ width:1200px; height:630px; overflow:hidden; }
  .og{ width:1200px; height:630px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px; text-align:center; position:relative; }
  .lockup{ display:flex; align-items:center; gap:44px; direction:ltr; color:var(--ink); }
  .lockup .mark{ height:104px; width:auto; }
  .lockup .weave{ height:58px; width:auto; }
  .lockup .x{ font-family:var(--disp); font-weight:700; font-size:3rem; color:var(--accent-hot); line-height:1; }
  h1{ font-size:2.35rem; max-width:1040px; white-space:nowrap; }
  .foot{ position:absolute; bottom:38px; inset-inline:0; border:0; padding:0; color:var(--faint); font-weight:700; font-size:1.05rem; }
  .foot b{ color:var(--accent-hot); }
</style>
</head>
<body>
<div class="og glow-wrap">
  <div class="eyebrow" style="margin:0;"><span class="num">شراكة</span><span>ماجد عنقاوي × Figma Weave</span></div>
  <div class="lockup">
    <img class="mark" src="../brand_assets/logo-majid-white.png" alt="">
    <span class="x">×</span>
    <img class="weave" src="img/figma-weave-wordmark.svg" alt="">
  </div>
  <h1 class="disp">١٥٠٠ كريدت من Figma Weave <span class="hl">حصرياً لطلاب ورش ماجد</span></h1>
  <div class="foot">malearnsa.com/figma-weave · <b>MA Learn</b></div>
</div>
</body>
</html>
