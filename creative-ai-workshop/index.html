  <style>
    @font-face{ font-family:'Gumela'; src:url('/brand_assets/gumela-arabic-bold.otf') format('opentype'); font-weight:700; font-display:swap; }

    *,*::before,*::after{ box-sizing:border-box; }
    html,body{ margin:0; height:100%; }
    body{
      background:var(--bg); color:var(--ink);
      font-family:'Cairo',sans-serif; -webkit-font-smoothing:antialiased;
      overflow:hidden;
    }

    .stage{ position:relative; width:100%; height:100vh; height:100svh; min-height:520px; overflow:hidden; }

    .bg{ position:absolute; inset:0; z-index:0; background:var(--bg); }
    .bg img{ width:100%; height:100%; object-fit:cover; object-position:100% 50%; display:block; } /* wide: trim the empty haze on the left so the figure clears the register */
    .scrim{ position:absolute; inset:0; }

    /* wide: register on the right (RTL start), welded into the art's dark drape */
    .scrim{ background:
      linear-gradient(180deg, rgba(21,16,9,.52) 0%, rgba(21,16,9,.22) 10%, rgba(21,16,9,0) 18%),
      linear-gradient(to left, #151009 0%, rgba(21,16,9,.90) 9%, rgba(21,16,9,.66) 23%, rgba(21,16,9,.30) 39%, rgba(21,16,9,0) 54%),
      linear-gradient(180deg, rgba(21,16,9,0) 76%, rgba(21,16,9,.42) 90%, rgba(21,16,9,.70) 100%); }

    .topbar{
      position:absolute; z-index:3; top:clamp(20px, 4.4vh, 48px); inset-inline:clamp(20px, 5vw, 96px);
      display:flex; align-items:center; justify-content:space-between;
    }
    .credit{ font-family:'Gumela','Cairo',sans-serif; font-weight:700; font-size:clamp(15px, 1.5vw, 26px); color:var(--muted); }
    .malogo{ height:clamp(26px, 2.8vw, 42px); width:auto; opacity:.92; display:block; }

    .register{
      position:absolute; z-index:2;
      inset-inline-start:clamp(24px, 5vw, 96px); top:0; bottom:0;
      width:min(38vw, 640px);
      display:flex; flex-direction:column; justify-content:center; align-items:flex-start; text-align:start;
    }
    .on-photo{ text-shadow:0 2px 20px rgba(21,16,9,.85), 0 0 58px rgba(21,16,9,.55); }

    h1{ margin:0; display:flex; align-items:center; flex-wrap:wrap; gap:.3em; font-weight:700; line-height:1.3; }
    h1 .n{ font-family:'Gumela','Cairo',sans-serif; font-size:clamp(28px, 3.4vw, 64px); color:var(--ink); }
    h1 .v{
      font-family:'Cairo',sans-serif; font-weight:900; font-size:clamp(17px, 1.9vw, 36px);
      background:var(--accent); color:var(--on-accent); border-radius:.4em; padding:.12em .55em; text-shadow:none; line-height:1.4;
    }

    .hook{ margin:clamp(12px, 2.2vh, 24px) 0 0; font-size:clamp(16px, 1.75vw, 32px); line-height:1.75; font-weight:700; color:var(--ink); max-width:30em; }
    .hook .hl{ color:var(--accent-hot); }

    .chips{ margin-top:clamp(18px, 3vh, 32px); display:flex; gap:clamp(8px, .8vw, 14px); flex-wrap:wrap; }
    .chip{
      display:inline-flex; align-items:center; border:1.5px solid rgba(248,240,230,.3); border-radius:999px;
      padding:.45em 1.15em; font-size:clamp(14px, 1.35vw, 25px); font-weight:700; line-height:1.4;
      background:rgba(21,16,9,.58); color:var(--ink);
    }
    .chip-solid{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:900; }
    .chip[lang="en"]{ letter-spacing:.06em; }

    /* tall (phones, portrait tablets): Majid's 9:16 art, stack centered at the bottom */
    @media (max-aspect-ratio: 1/1){
      .scrim{ background:linear-gradient(180deg,
        rgba(21,16,9,.52) 0%, rgba(21,16,9,.30) 12%, rgba(21,16,9,.12) 20%,
        rgba(21,16,9,.04) 30%, rgba(21,16,9,.04) 40%, rgba(21,16,9,.30) 50%,
        rgba(21,16,9,.66) 60%, rgba(21,16,9,.88) 70%, rgba(21,16,9,.96) 82%, #151009 96%); }
      .bg img{ object-position:50% 22%; }
      .register{
        inset-inline:clamp(16px, 6vw, 70px); top:auto; bottom:max(clamp(28px, 7vh, 120px), env(safe-area-inset-bottom));
        width:auto; align-items:center; text-align:center;
      }
      h1{ justify-content:center; }
      h1 .n{ font-size:clamp(26px, 7.6vw, 72px); }
      h1 .v{ font-size:clamp(15px, 4.3vw, 42px); }
      .hook{ font-size:clamp(15px, 4.2vw, 36px); max-width:24em; }
      .chips{ justify-content:center; }
      .chip{ font-size:clamp(13px, 3.4vw, 26px); }
      .credit{ font-size:clamp(14px, 3.6vw, 26px); }
      .malogo{ height:clamp(24px, 6vw, 38px); }
    }
